# Generate the Xcode project with `xcodegen` (brew install xcodegen). The .xcodeproj is not committed.
name: MusicSheet
options:
  bundleIdPrefix: com.kevindai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MusicSheetKit:
    path: MusicSheetKit
targets:
  MusicSheet:
    type: application
    platform: iOS
    sources:
      - path: MusicSheet
    dependencies:
      - package: MusicSheetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevindai.musicsheet
        PRODUCT_NAME: MusicSheet
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: MusicSheet-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 练琴谱
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 连接你电脑上运行的曲谱后端。
    scheme: {}
