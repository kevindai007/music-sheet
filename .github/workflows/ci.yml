name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build Docker image
        run: docker build -t music-sheet-api .

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Test MusicSheetKit
        run: swift test --package-path MusicSheetKit
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen
      - name: Build app for the simulator
        run: |
          xcodebuild build \
            -project MusicSheet.xcodeproj \
            -scheme MusicSheet \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
